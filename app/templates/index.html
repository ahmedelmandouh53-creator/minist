<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>MNIST Digit Recognizer</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
  <header>
    <div>
      <h1>MNIST Digit Recognizer</h1>
      <p class="sub">Draw a digit (0-9), choose a model, then press Predict.</p>
    </div>
    <a class="nav-link" href="/comparison">Model comparison &rarr;</a>
  </header>

  <div class="layout">
    <section class="card">
      <p class="label">Draw</p>
      <div class="canvas-wrap">
        <canvas id="canvas" width="280" height="280"></canvas>
        <div id="hint" class="canvas-hint">Draw a digit here</div>
      </div>
      <div class="row">
        <button id="clear">Clear</button>
        <button id="predict" class="primary">Predict</button>
      </div>
      <p class="hint">Tip: draw one large, thick digit.</p>
    </section>

    <section class="card result">
      <p class="label">Model</p>
      <div class="seg">
        {% for key, label in models.items() %}
        {% set parts = label.split(' - ') %}
        <input type="radio" name="model" id="model-{{ key }}" value="{{ key }}" {% if loop.first %}checked{% endif %}>
        <label for="model-{{ key }}"><span class="name">{{ parts[-1] }}</span><span class="kind">{{ parts[0] if parts|length > 1 }}</span></label>
        {% endfor %}
      </div>

      <p class="label">Prediction</p>
      <div class="summary">
        <div class="digit-box"><div id="digit" class="digit placeholder">?</div></div>
        <div>
          <div id="conf" class="conf placeholder">&ndash;</div>
          <div id="used" class="used"></div>
        </div>
      </div>
      <div id="error" class="error"></div>
      <div id="bars"></div>
    </section>
  </div>
</main>
<script>
const canvas = document.getElementById("canvas"), ctx = canvas.getContext("2d");
const digitEl = document.getElementById("digit"), confEl = document.getElementById("conf"),
      usedEl = document.getElementById("used"), errorEl = document.getElementById("error"),
      barsEl = document.getElementById("bars"), hintEl = document.getElementById("hint");
let drawing = false, hasInk = false;

// ten probability bars, created once so the fill can animate
const bars = Array.from({ length: 10 }, (_, i) => {
  const row = document.createElement("div");
  row.className = "bar";
  row.innerHTML = `<span>${i}</span><div class="track"><div class="fill"></div></div><span class="pct">&ndash;</span>`;
  barsEl.appendChild(row);
  return row;
});
function showBars(probs) {
  const max = probs ? Math.max(...probs) : null;
  bars.forEach((row, i) => {
    row.classList.toggle("top", !!probs && probs[i] === max);
    row.querySelector(".fill").style.width = probs ? (probs[i] * 100).toFixed(1) + "%" : "0%";
    row.querySelector(".pct").textContent = probs ? (probs[i] * 100).toFixed(1) + "%" : "–";
  });
}

function selectedModel() { return document.querySelector('input[name="model"]:checked').value; }

function resetCanvas() {
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 20; ctx.lineCap = "round"; ctx.lineJoin = "round";
  hasInk = false; hintEl.classList.remove("hidden");
}
function resetResult() {
  digitEl.textContent = "?"; digitEl.classList.add("placeholder");
  confEl.textContent = "–"; confEl.classList.add("placeholder"); usedEl.textContent = "Prediction will appear here.";
  errorEl.textContent = ""; showBars(null);
}
function pos(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) * canvas.width / r.width, (e.clientY - r.top) * canvas.height / r.height];
}
canvas.addEventListener("pointerdown", e => {
  drawing = true; canvas.setPointerCapture(e.pointerId);
  const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 0.01, y); ctx.stroke();
  hasInk = true; hintEl.classList.add("hidden");
});
canvas.addEventListener("pointermove", e => { if (!drawing) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); });
["pointerup", "pointercancel"].forEach(t => canvas.addEventListener(t, () => { drawing = false; }));

document.getElementById("clear").onclick = () => { resetCanvas(); resetResult(); };

async function predict() {
  errorEl.textContent = "";
  if (!hasInk) { errorEl.textContent = "The canvas is empty - draw a digit first."; return; }
  usedEl.textContent = "Predicting...";
  try {
    const res = await fetch("/api/predict", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: selectedModel(), image: canvas.toDataURL("image/png") }) });
    const data = await res.json();
    if (!res.ok) { errorEl.textContent = data.error; usedEl.textContent = ""; return; }
    digitEl.textContent = data.digit; digitEl.classList.remove("placeholder");
    confEl.textContent = (Math.max(...data.probabilities) * 100).toFixed(1) + "%"; confEl.classList.remove("placeholder");
    usedEl.textContent = "confidence · " + data.model_label;
    showBars(data.probabilities);
  } catch (err) { errorEl.textContent = "Request failed: " + err; usedEl.textContent = ""; }
}
document.getElementById("predict").onclick = predict;
document.querySelectorAll('input[name="model"]').forEach(r => r.onchange = () => { if (hasInk) predict(); });
resetCanvas(); resetResult();
</script>
</body>
</html>
